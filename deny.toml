[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "paste has no patched release; Specta and Tauri use it transitively." },
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error has no patched release; Tauri's Linux GTK dependencies use it transitively." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  # foldhash and zlib-rs require Zlib.
  "Zlib",
  # ICU's icu_*, litemap, potential_utf, tinystr, writeable, yoke*, zerofrom*,
  # zerotrie, zerovec*, and unicode-ident require Unicode-3.0.
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
